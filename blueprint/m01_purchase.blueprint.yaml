blueprint_version: "1.0.0"
module: M01-purchase
owner: M01-purchase
stack:
  backend: "NestJS + Prisma"
  frontend: "React + TypeScript"
  tests: "Jest (unit) + supertest (api) + integration"
description: >
  Purchase Management — Supplier se start hokar RFQ, Quotation, Purchase Order,
  receiving reference, Purchase Invoice, Purchase Return aur Supplier Settlement
  tak ka poora workflow. Inventory ownership yahan NAHI hai (M02).

external_contracts:
  - target: M02-inventory
    file: contracts/M01_to_M02_inventory.yaml
    fields: [product, quantity, unit, warehouse, receipt, grn_reference, stock_movement_reference]
  - target: M04-gst
    file: contracts/M01_to_M04_gst.yaml
    fields: [supplier, gstin, hsn_sac, taxable_value, cgst, sgst, igst, cess, invoice_reference]
  - target: M05-account
    file: contracts/M01_to_M05_account.yaml
    fields: [supplier_payable, purchase_value, freight_cost, invoice_value, payment_reference, accounting_reference]

forbidden:
  - "Stock ownership (belongs to M02-inventory)"
  - "Sales logic (M06 onward)"
  - "GST calculation/compliance (belongs to M04-gst)"
  - "Ledger/Journal (belongs to M05-account)"
  - "Payroll/HR (belongs to Management module)"
  - "Direct DB/internal access into any other module"

# ---------------------------------------------------------------------------
# हर file जो generator बनाना जानता है, यहाँ declare है।
# generator इस list के बाहर कोई file कभी नहीं बनाएगा — यही "single source
# of truth" गारंटी है। नई file चाहिए तो पहले यहीं जोड़ी जाएगी, generator में नहीं।
# ---------------------------------------------------------------------------
